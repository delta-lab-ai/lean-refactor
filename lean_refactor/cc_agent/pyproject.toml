[project]
name = "cc-agent"
version = "0.1.0"
description = "Claude Code agent for Lean 4 proof optimization"
requires-python = ">=3.10"
dependencies = [
    "fire>=0.7.1",
    "pyyaml>=6.0.3",
    "numpy>=1.26",
    "leanclient==0.9.2",
    "easydict==1.13"
]

[project.scripts]
cc-golf = "scripts.run_golf:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
